name: CI/CD Build and Push to GHCR

on:
  push:
    branches: [ "main" ]

# 定義這條流水線需要的權限（允許寫入 GitHub Container Registry）
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. 登入 GitHub 內建的 Container Registry (GHCR)
    - name: Log in to the Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # GitHub 會自動提供安全的 Token

    # 2. 將專案名稱轉為小寫（GitHub 要求 repository 名稱必須為小寫）
    - name: Lowercase Repository Name
      id: string_case
      uses: volpg/lowercase-action@v1 # 或者透過環境變數處理，我們也可以用標準寫法
      with:
        text: ${{ github.repository }}

    # 3. 建立 Docker Buildx 環境
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. 打包 Docker Image 並直接推送到 GHCR 雲端倉庫
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true # 這次改為 true！打包完直接推送到雲端
        tags: |
          ghcr.io/${{ github.repository }}:latest