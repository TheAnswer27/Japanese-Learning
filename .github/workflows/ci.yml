name: CI/CD Build and Push to GHCR (Frontend)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-press:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Lowercase Repository Name
      id: repo_lower
      run: |
        echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Log in to the Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 1. 先在 Runner 本地建置映像檔（載入至 Docker daemon 供掃描使用）
    - name: Build Docker image locally
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        load: true
        tags: |
          ghcr.io/${{ env.REPO_LOWER }}:latest
          ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}

    # 2. 🛡️ DevSecOps 核心：使用 Trivy 掃描容器映像檔漏洞
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ env.REPO_LOWER }}:latest'
        format: 'table'
        exit-code: '0' # 設為 '0' 僅印出報告不中斷；若改為 '1' 則會強制阻擋含有高危漏洞(CRITICAL/HIGH)的映像檔推送
        severity: 'CRITICAL,HIGH'

    # 3. 掃描完成後，將映像檔正式推送到 GHCR
    - name: Push Docker image to GHCR
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LOWER }}:latest
          ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}